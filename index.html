<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체중 기록 웹앱</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>체중 기록 웹앱</h1>
      <p class="description">시작 체중과 현재 체중을 입력하고 감량 변화를 확인해보세요.</p>

      <!-- 시작 체중과 현재 체중 입력 영역 -->
      <section class="card">
        <h2>체중 입력</h2>
        <div class="form-grid">
          <label for="startWeight">시작 체중 (kg)</label>
          <input id="startWeight" type="number" step="0.1" min="0" placeholder="예: 70" />

          <label for="currentWeight">현재 체중 (kg)</label>
          <input id="currentWeight" type="number" step="0.1" min="0" placeholder="예: 66.5" />
        </div>
      </section>

      <!-- 자동 계산 결과 표시 영역 -->
      <section class="card result-card">
        <h2>자동 계산 결과</h2>
        <p>감량 kg: <strong id="lossKg">0.0</strong> kg</p>
        <p>감량률: <strong id="lossRate">0.00</strong> %</p>
      </section>

      <!-- 날짜 + 체중 기록 저장 영역 -->
      <section class="card">
        <h2>기록 저장</h2>
        <div class="form-grid">
          <label for="recordDate">기록 날짜</label>
          <input id="recordDate" type="date" />

          <label for="recordWeight">기록 체중 (kg)</label>
          <input id="recordWeight" type="number" step="0.1" min="0" placeholder="예: 66.5" />
        </div>
        <button id="saveRecordButton" type="button">기록 저장하기</button>
      </section>

      <!-- 저장된 기록 테이블 -->
      <section class="card">
        <h2>저장된 기록</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>체중 (kg)</th>
              </tr>
            </thead>
            <tbody id="recordTableBody">
              <!-- JavaScript로 기록 행이 추가됩니다. -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
